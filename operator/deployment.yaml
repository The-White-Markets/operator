apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-operator
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: basic-operator
  template:
    metadata:
      labels:
        app: basic-operator
    spec:
      serviceAccountName: basic-operator
      containers:
      - name: operator
        image: basic-operator:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: basic-operator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: basic-operator
rules:
- apiGroups: ["example.com"]
  resources: ["myresources"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["example.com"]
  resources: ["myresources/status"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: basic-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: basic-operator
subjects:
- kind: ServiceAccount
  name: basic-operator
  namespace: default