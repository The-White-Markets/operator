apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: myresources.example.com
spec:
  group: example.com
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              replicas:
                type: integer
                minimum: 1
                default: 1
              image:
                type: string
                default: "nginx:latest"
          status:
            type: object
            properties:
              phase:
                type: string
              message:
                type: string
              lastUpdated:
                type: string
    subresources:
      status: {}
  scope: Namespaced
  names:
    plural: myresources
    singular: myresource
    kind: MyResource